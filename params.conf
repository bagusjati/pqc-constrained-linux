# Global parameters of the benchmark harness.
# Relative paths resolve from the repository root.
# A value set in the environment takes precedence over this file.

# Docker image (built once, reused on every host)
IMAGE=pqc-tier-bench:1.0
# Saved image archive, copied from the build host to the Raspberry Pi
IMAGE_TAR=pqc-tier-bench-1.0.tar.gz

# Folder locations
# RESULTS_DIR: one subfolder per host (m1, pi, m1_pilot, pi_pilot)
RESULTS_DIR=results
# SCHEDULE_DIR: generated schedules (schedule_<host>.json)
SCHEDULE_DIR=schedules
# ARCHIVE_DIR: zip archives written by pilot and finish scripts
ARCHIVE_DIR=archives

# Master seed of the execution schedule
SEED=20260928
